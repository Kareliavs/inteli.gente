<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil Municipal · inteli.gente</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0B1220; --panel:#111A2E; --panel-2:#0E1626; --line:rgba(231,236,245,0.12);
    --text:#E7ECF5; --muted:#8291A8; --muted-2:#57657C;
    --current:#3E8ED0; --ref:#F0B55C;
    --lvl-low:#F5A623; --lvl-high:#2DD4BF;
    --brand-navy:#132257; --brand-teal:#2FE0C4;
    --serif: 'Source Serif Pro', Georgia, 'Iowan Old Style', serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;}
  a{color:inherit;}
  .app{height:100vh;display:flex;flex-direction:column;padding:8px 10px;}

  .ov-brand{top:14px;left:280px;display:flex;align-items:center;gap:8px;
    background:rgba(17,26,46,0.85);backdrop-filter:blur(6px);border:1px solid var(--line);
    padding:7px 12px;border-radius:9px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
  .ov-brand .ig{font-family:var(--serif);font-weight:700;font-size:14px;color:#fff;}
  .ov-brand .ig b{color:var(--brand-teal);}
  .ov-brand .vis{font-family:var(--sans);font-weight:800;font-size:14px;color:#fff;}

  .stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a0f1c;
    flex:1 1 auto;min-height:0;}
  #leaflet-map{position:absolute;inset:0;background:#0a0f1c;}
  #leaflet-map .leaflet-tile-pane{filter:invert(1) hue-rotate(200deg) brightness(0.82) contrast(0.92) saturate(0.55);}
  #chart-overlay{position:absolute;inset:0;pointer-events:none;z-index:450;}
  .leaflet-container{background:#0a0f1c;font-family:var(--sans);}

  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0f1c;z-index:2000;font-family:var(--mono);font-size:13px;color:var(--muted);flex-direction:column;gap:10px;}
  .loading.hide{display:none;}
  .loading .bar{width:180px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}
  .loading .bar i{display:block;height:100%;width:30%;background:var(--current);animation:load 1.1s ease-in-out infinite;}
  @keyframes load{0%{margin-left:-30%;}100%{margin-left:100%;}}

  .ov{position:absolute;z-index:1000;}
  .ov-search{top:14px;left:14px;width:250px;}
  .ov-search input{width:100%;background:rgba(17,26,46,0.85);backdrop-filter:blur(6px);
    border:1px solid var(--line);color:var(--text);font-size:13.5px;padding:9px 12px;border-radius:9px;outline:none;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);}
  .ov-search input:focus{border-color:var(--current);}
  .search-results{margin-top:4px;background:#141F38;border:1px solid var(--line);border-radius:8px;
    max-height:210px;overflow-y:auto;display:none;box-shadow:0 8px 20px rgba(15,23,42,0.12);}
  .search-results.show{display:block;}
  .search-results div{padding:7px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);}
  .search-results div:hover{background:rgba(62,142,208,0.15);}
  .search-results .uf{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:6px;}

  .ov-reset{top:14px;right:14px;}
  .ov-reset button{background:rgba(17,26,46,0.85);backdrop-filter:blur(6px);border:1px solid var(--line);
    color:var(--muted);font-family:var(--mono);font-size:11.5px;padding:8px 13px;border-radius:9px;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);}
  .ov-reset button:hover{color:var(--text);border-color:var(--current);}

  .ov-drag-hint{bottom:14px;left:50%;transform:translateX(-50%);text-align:center;color:var(--muted);
    font-family:var(--mono);font-size:11px;background:rgba(17,26,46,0.85);backdrop-filter:blur(6px);
    padding:7px 14px;border-radius:9px;pointer-events:none;border:1px solid var(--line);}
  .ov-drag-hint.hide{opacity:0;}

  .ov-legend-btn{bottom:14px;left:14px;}
  .ov-legend-btn button{background:rgba(17,26,46,0.85);backdrop-filter:blur(6px);border:1px solid var(--line);
    color:var(--muted);font-family:var(--mono);font-size:11px;padding:7px 12px;border-radius:9px;cursor:pointer;}
  .ov-legend-btn button:hover{color:var(--text);}
  .dim-legend{position:absolute;bottom:52px;left:14px;z-index:1001;background:#141F38;border:1px solid var(--line);
    border-radius:10px;padding:14px 16px;width:340px;max-height:520px;overflow-y:auto;display:none;
    box-shadow:0 12px 30px rgba(0,0,0,0.4);}
  .dim-legend.show{display:block;}
  .dim-legend .dim-block{margin-bottom:14px;}
  .dim-legend .dim-block:last-child{margin-bottom:0;}
  .dim-legend .dim-head{display:flex;gap:8px;align-items:baseline;margin-bottom:4px;}
  .dim-legend .dim-name{font-weight:700;font-size:13.5px;}
  .dim-legend .topic-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:3px 0 3px 4px;
    border-left:2px solid var(--line);padding-left:8px;color:var(--text);}
  .dim-legend .topic-row .cnt{color:var(--muted-2);font-family:var(--mono);font-size:10px;white-space:nowrap;}

  .ov-scale{bottom:14px;right:14px;display:flex;border-radius:9px;overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.3);border:1px solid var(--line);}
  .ov-scale .tick{width:30px;text-align:center;font-family:var(--mono);font-size:12px;padding:8px 2px;
    color:#fff;font-weight:700;cursor:pointer;transition:transform 100ms ease;}
  .ov-scale .tick:hover{filter:brightness(1.15);}
  .ov-scale .tick.active{transform:scaleY(1.15);box-shadow:0 0 0 2px #fff inset;}
  .tick-label-row{position:absolute;bottom:38px;right:14px;font-family:var(--mono);font-size:9px;
    color:var(--muted);display:flex;gap:36px;z-index:1000;pointer-events:none;}

  .dim-label{font-family:var(--mono);font-weight:700;font-size:12px;fill:var(--text);cursor:help;pointer-events:auto;}
  .ring-seg{cursor:pointer;pointer-events:auto;}
  .ring-seg.current{fill:var(--current);}
  .ring-tick{stroke:#fff;stroke-width:1.6;stroke-linecap:round;pointer-events:none;}
  .ring-avg-line{fill:none;stroke:rgba(255,255,255,0.55);stroke-width:1.3;stroke-dasharray:3 3;pointer-events:none;}
  .ring-seg-bg{fill:rgba(255,255,255,0.045);}
  .bar-label{font-family:var(--mono);font-size:8.5px;fill:#fff;dominant-baseline:middle;
    paint-order:stroke;stroke:rgba(11,18,32,0.85);stroke-width:2.2px;stroke-linejoin:round;}
  .bar-label.nodata{fill:rgba(255,255,255,0.4);font-size:7.5px;stroke:none;}
  .dim-ring-seg{fill:rgba(255,255,255,0.06);}
  .dim-ring-seg.filled{}
  .dim-ring-label{font-family:var(--serif);font-weight:800;font-size:15px;fill:#fff;}
  .center-hole{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 4;}
  .reticle-dot{fill:var(--current);stroke:#fff;stroke-width:1.5;}
  .header-box{fill:rgba(17,26,46,0.88);stroke:var(--line);stroke-width:1;}
  .center-text-name{fill:#fff;font-family:var(--serif);font-size:24px;font-weight:700;}
  .center-text-sub{fill:var(--muted);font-family:var(--mono);font-size:12px;}
  .center-text-levels{font-family:var(--mono);font-size:16px;font-weight:700;}
  .spider-poly{fill:rgba(47,224,196,0.10);stroke:var(--brand-teal);stroke-width:1.6;stroke-dasharray:4 3;pointer-events:none;}
  .spider-axis{stroke:rgba(255,255,255,0.08);stroke-width:1;}
  .grid-ring{fill:none;stroke:rgba(255,255,255,0.05);stroke-width:1;}

  .tooltip{position:fixed;pointer-events:none;background:#141F38;border:1px solid var(--line);border-radius:8px;
    padding:9px 11px;font-size:12px;line-height:1.5;max-width:270px;z-index:2000;opacity:0;
    transition:opacity 100ms ease;box-shadow:0 10px 26px rgba(0,0,0,0.4);color:var(--text);}
  .tooltip.wide{max-width:340px;}
  .tooltip.show{opacity:1;}
  .tooltip .t-title{font-weight:700;margin-bottom:3px;color:var(--text);font-size:13.5px;}
  .tooltip .t-dim{color:var(--muted);font-family:var(--mono);font-size:10.5px;margin-bottom:5px;}
  .tooltip .t-sec{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.04em;
    margin:8px 0 3px;padding-top:6px;border-top:1px solid var(--line);}
  .tooltip .t-sec.pos{color:var(--lvl-high);}
  .tooltip .t-sec.neg{color:var(--lvl-low);}
  .tooltip .t-row{display:flex;justify-content:space-between;gap:14px;}
  .tooltip .t-row span{color:var(--text);}
  .tooltip .t-row b.cur{color:var(--current);white-space:nowrap;}
  .tooltip .t-row b.ref{color:var(--ref);white-space:nowrap;}

  .muni-label{font-family:var(--mono) !important;font-size:10px !important;background:rgba(17,26,46,0.95) !important;
    border:1px solid var(--line) !important;color:var(--text) !important;padding:1px 5px !important;border-radius:4px !important;
    box-shadow:0 1px 4px rgba(0,0,0,0.3) !important;}
  .muni-label::before{display:none !important;}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <div id="leaflet-map"></div>
    <svg id="chart-overlay"></svg>
    <div class="loading" id="loading"><div>carregando dados…</div><div class="bar"><i></i></div></div>

    <div class="ov ov-search">
      <input id="search-input" type="text" placeholder="Buscar município ou UF…" autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="ov ov-brand"><span class="ig">inteli<b>.gente</b></span><span class="vis">vis</span></div>
    <div class="ov ov-reset"><button id="reset-btn">↺ ver Brasil todo</button></div>
    <div class="ov ov-drag-hint" id="drag-hint">arraste o mapa · clique num ponto · ou busque acima</div>
    <div class="ov ov-legend-btn"><button id="legend-btn">ⓘ dimensões e tópicos</button></div>
    <div class="dim-legend" id="dim-legend"></div>
    <div class="ov ov-scale" id="ov-scale"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =========================================================
   CSV LOADING
   ========================================================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ',') { row.push(field); field=''; }
      else if(c === '\r'){}
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const header = rows[0];
  return rows.slice(1).filter(r=>r.length===header.length && r.some(v=>v!=='')).map(r=>{
    const obj = {}; header.forEach((h,i)=> obj[h]=r[i]); return obj;
  });
}
function fastSplitCSV(text){
  const lines = text.split('\n');
  const header = lines[0].replace('\r','').split(',');
  const out = [];
  for(let i=1;i<lines.length;i++){
    const line = lines[i].replace('\r','');
    if(!line) continue;
    const parts = line.split(',');
    if(parts.length!==header.length) continue;
    const obj = {}; for(let j=0;j<header.length;j++) obj[header[j]]=parts[j];
    out.push(obj);
  }
  return out;
}

async function loadData(){
  const [muniTxt, topicsTxt, dimsTxt, scoresTxt, destaquesTxt] = await Promise.all([
    fetch('municipios.csv').then(r=>r.text()),
    fetch('topics.csv').then(r=>r.text()),
    fetch('dims.csv').then(r=>r.text()),
    fetch('scores.csv').then(r=>r.text()),
    fetch('destaques.csv').then(r=>r.text()),
  ]);
  const MUNI = parseCSV(muniTxt).map(r=>({
    cod:r.cod_ibge, nome:r.nome, uf:r.uf, regiao:r.regiao,
    lat: r.lat?parseFloat(r.lat):null, lon: r.lon?parseFloat(r.lon):null
  }));
  const TOPICS = parseCSV(topicsTxt).map(r=>({sigla:r.topico_sigla, nome:r.topico_nome, dim:r.dimensao_sigla, n:parseInt(r.n_indicadores)}));
  const DIMS = parseCSV(dimsTxt).map(r=>({sigla:r.dimensao_sigla, nome:r.dimensao_nome}));
  const scoreRows = fastSplitCSV(scoresTxt);
  const SCORES = {}; // cod -> topico -> {nc,yc,no,yo}  (nc/no are decimal topic scores)
  scoreRows.forEach(r=>{
    if(!SCORES[r.cod_ibge]) SCORES[r.cod_ibge] = {};
    SCORES[r.cod_ibge][r.topico] = {
      nc: r.score_cur? parseFloat(r.score_cur): null, yc: r.ano_cur? parseInt(r.ano_cur): null,
      no: r.score_old? parseFloat(r.score_old): null, yo: r.ano_old? parseInt(r.ano_old): null,
    };
  });
  const destRows = parseCSV(destaquesTxt);
  const DESTAQUES = {}; // cod -> dim -> {pos:[...], neg:[...]}
  destRows.forEach(r=>{
    if(!DESTAQUES[r.cod_ibge]) DESTAQUES[r.cod_ibge] = {};
    if(!DESTAQUES[r.cod_ibge][r.dimensao]) DESTAQUES[r.cod_ibge][r.dimensao] = {pos:[],neg:[]};
    DESTAQUES[r.cod_ibge][r.dimensao][r.tipo].push({nome:r.indicador_nome, nivel:parseFloat(r.nivel)});
  });
  return { MUNI, TOPICS, DIMS, SCORES, DESTAQUES };
}

/* =========================================================
   MAIN
   ========================================================= */
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){ const el=document.createElementNS(NS,tag); for(const k in attrs) el.setAttribute(k,attrs[k]); return el; }
function normalize(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
const LEVEL_COLORS = {1:'#A00000',2:'#E23A23',3:'#E27400',4:'#3E8ED0',5:'#1C4F9C',6:'#3F9D00',7:'#375623'};
const LVL_LOW = '#F5A623', LVL_HIGH = '#2DD4BF', LVL_NONE = '#57657C';
function tierColor(level){ return level==null ? LVL_NONE : (level<=2 ? LVL_LOW : LVL_HIGH); }

loadData().then(({MUNI, TOPICS, DIMS, SCORES, DESTAQUES})=>{
  document.getElementById('loading').classList.add('hide');

  const state = { focusCod:null, filterLevel:null };
  const muniByCod = new Map(MUNI.map(m=>[m.cod,m]));
  const dimByCode = new Map(DIMS.map(d=>[d.sigla,d]));
  const topicBySigla = new Map(TOPICS.map(t=>[t.sigla,t]));
  const dimsOrder = DIMS.map(d=>d.sigla);
  const topicsByDim = {};
  dimsOrder.forEach(d=>topicsByDim[d]=[]);
  TOPICS.forEach(t=>{ if(topicsByDim[t.dim]) topicsByDim[t.dim].push(t.sigla); });

  function topicScore(cod, topico){ return (SCORES[cod] && SCORES[cod][topico]) || null; }
  function dimLevel(cod, dim, snapshot){ // snapshot: 'c' or 'o'
    const topics = topicsByDim[dim];
    const vals = [];
    topics.forEach(ts=>{
      const s = topicScore(cod, ts);
      if(!s) return;
      const v = snapshot==='c' ? s.nc : s.no;
      if(v!=null) vals.push(v);
    });
    return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null;
  }
  function muniLevel(cod, snapshot){
    const vals = dimsOrder.map(d=>dimLevel(cod,d,snapshot)).filter(v=>v!=null);
    return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null;
  }

  /* ---------- Leaflet map (light basemap) ---------- */
  const map = L.map('leaflet-map', { zoomControl:true, minZoom:4, maxZoom:14, worldCopyJump:false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', subdomains:'abc', maxZoom:19
  }).addTo(map);

  let latMin=90, latMax=-90, lonMin=180, lonMax=-180;
  MUNI.forEach(m=>{
    if(m.lat==null||m.lon==null) return;
    if(m.lat<latMin) latMin=m.lat; if(m.lat>latMax) latMax=m.lat;
    if(m.lon<lonMin) lonMin=m.lon; if(m.lon>lonMax) lonMax=m.lon;
  });
  const brazilBounds = L.latLngBounds([latMin,lonMin],[latMax,lonMax]);
  map.fitBounds(brazilBounds, {padding:[30,30]});

  const canvasRenderer = L.canvas({ padding: 0.5 });
  const markerByCod = new Map();
  const BASE_R = 5, HOVER_R = 8, FOCUS_R = 9.5;
  MUNI.forEach(m=>{
    if(m.lat==null||m.lon==null) return;
    const cm = L.circleMarker([m.lat,m.lon], {
      renderer: canvasRenderer, radius:BASE_R, weight:1, color:'#fff',
      fillColor: LVL_NONE, fillOpacity:0.85
    }).addTo(map);
    cm.on('mouseover', (e)=>{
      cm.setRadius(HOVER_R);
      const lvl = muniLevel(m.cod,'c');
      showTooltip(`<div class="t-title">${m.nome}</div><div class="t-dim">${m.uf} · nível ${lvl!=null?lvl:'sem dado'}</div>`, e.originalEvent);
    });
    cm.on('mousemove', (e)=> moveTooltip(e.originalEvent));
    cm.on('mouseout', ()=>{ if(String(m.cod)!==String(state.focusCod)) cm.setRadius(BASE_R); hideTooltip(); });
    cm.on('click', (e)=>{
      L.DomEvent.stopPropagation(e);
      if(state.filterLevel!=null) exitLevelFilter();
      map.setView([m.lat,m.lon], Math.max(map.getZoom(),8), {animate:true});
    });
    markerByCod.set(String(m.cod), cm);
  });
  map.on('click', (e)=> map.setView(e.latlng, Math.max(map.getZoom(),7), {animate:true}));

  function recolorMarkers(){
    MUNI.forEach(m=>{
      const cm = markerByCod.get(String(m.cod));
      if(!cm) return;
      cm.setStyle({fillColor: tierColor(muniLevel(m.cod,'c'))});
    });
  }

  /* ---------- fixed chart overlay ---------- */
  const stageEl = document.querySelector('.stage');
  const overlay = document.getElementById('chart-overlay');
  let CX=0, CY=0, R_INNER=46, R_OUTER=172, bandHeight=10, R_DIMRING=190;

  const chartAnchor = svgEl('g', {id:'chart-anchor'});
  overlay.appendChild(chartAnchor);
  const haloGrad = svgEl('radialGradient', {id:'haloGrad'});
  haloGrad.appendChild(svgEl('stop', {offset:'0%','stop-color':'#0E1626','stop-opacity':'0'}));
  haloGrad.appendChild(svgEl('stop', {offset:'55%','stop-color':'#0E1626','stop-opacity':'0.72'}));
  haloGrad.appendChild(svgEl('stop', {offset:'80%','stop-color':'#0E1626','stop-opacity':'0.88'}));
  haloGrad.appendChild(svgEl('stop', {offset:'100%','stop-color':'#0E1626','stop-opacity':'0'}));
  const defs = svgEl('defs', {}); defs.appendChild(haloGrad); overlay.appendChild(defs);

  let ringsGroup, dimLabelsGroup, dimRingGroup, spiderGroup, titleEl, subEl, levelsEl;

  const maxTopicsInDim = Math.max(...dimsOrder.map(d=>topicsByDim[d].length));
  const totalTopics = TOPICS.length;
  const WEDGE_GAP_DEG = 5;
  const totalGap = WEDGE_GAP_DEG * dimsOrder.length;
  const usableDeg = 360 - totalGap;
  let wedgeAngles = {};
  { let cursor=-90;
    dimsOrder.forEach(d=>{
      const count = topicsByDim[d].length;
      const span = usableDeg * (count/totalTopics);
      wedgeAngles[d] = {start:cursor, end:cursor+span, mid:cursor+span/2};
      cursor += span + WEDGE_GAP_DEG;
    });
  }
  function polar(cx,cy,r,deg){ const rad=deg*Math.PI/180; return {x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad)}; }
  function annularSectorPath(cx,cy,r0,r1,a0,a1){
    const large = Math.abs(a1-a0) > 180 ? 1 : 0;
    const sweep = a1 > a0 ? 1 : 0;
    const p0=polar(cx,cy,r0,a0), p1=polar(cx,cy,r1,a0), p2=polar(cx,cy,r1,a1), p3=polar(cx,cy,r0,a1);
    return `M ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}
            A ${r1.toFixed(2)} ${r1.toFixed(2)} 0 ${large} ${sweep} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}
            L ${p3.x.toFixed(2)} ${p3.y.toFixed(2)}
            A ${r0.toFixed(2)} ${r0.toFixed(2)} 0 ${large} ${1-sweep} ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} Z`;
  }

  function buildChartChrome(){
    chartAnchor.innerHTML = '';
    const halo = svgEl('circle', {cx:0, cy:0, r:R_DIMRING+60, fill:'url(#haloGrad)'});
    chartAnchor.appendChild(halo);
    const gridGroup = svgEl('g', {});
    [0.33,0.66,1].forEach(f=>{
      gridGroup.appendChild(svgEl('circle', {cx:0,cy:0,r:R_INNER+(R_OUTER-R_INNER)*f, class:'grid-ring'}));
    });
    chartAnchor.appendChild(gridGroup);
    ringsGroup = svgEl('g', {id:'rings-group'});
    chartAnchor.appendChild(ringsGroup);
    spiderGroup = svgEl('g', {id:'spider-group'});
    chartAnchor.appendChild(spiderGroup);
    dimRingGroup = svgEl('g', {id:'dim-ring-group'});
    chartAnchor.appendChild(dimRingGroup);
    dimLabelsGroup = svgEl('g', {id:'dim-labels-group'});
    chartAnchor.appendChild(dimLabelsGroup);
    const hole = svgEl('circle', {cx:0, cy:0, r:R_INNER-8, class:'center-hole'});
    chartAnchor.appendChild(hole);
    const reticleDot = svgEl('circle', {cx:0, cy:0, r:2.5, class:'reticle-dot'});
    chartAnchor.appendChild(reticleDot);

    const headerBoxY = -R_DIMRING-66;
    const headerBox = svgEl('rect', {x:-150, y:headerBoxY, width:300, height:68, rx:10, class:'header-box'});
    chartAnchor.appendChild(headerBox);
    titleEl = svgEl('text', {x:0, y:-R_DIMRING-40, 'text-anchor':'middle', class:'center-text-name'});
    chartAnchor.appendChild(titleEl);
    subEl = svgEl('text', {x:0, y:-R_DIMRING-20, 'text-anchor':'middle', class:'center-text-sub'});
    chartAnchor.appendChild(subEl);
    levelsEl = svgEl('text', {x:0, y:-R_DIMRING-2, 'text-anchor':'middle', class:'center-text-levels'});
    chartAnchor.appendChild(levelsEl);

    dimsOrder.forEach(dim=>{
      const {mid} = wedgeAngles[dim];
      const labelR = R_DIMRING + 24;
      const lp = polar(0,0,labelR,mid);
      const info = dimByCode.get(dim);
      const label = svgEl('text', {x:lp.x.toFixed(1), y:lp.y.toFixed(1), class:'dim-label', 'text-anchor':'middle', 'dominant-baseline':'middle'});
      label.textContent = info ? info.nome : dim;
      label.addEventListener('mousemove', (e)=>{
        const lvl = state.focusCod!=null ? dimLevel(state.focusCod, dim, 'c') : null;
        const dest = (state.focusCod!=null && DESTAQUES[state.focusCod] && DESTAQUES[state.focusCod][dim]) || {pos:[],neg:[]};
        const posHtml = dest.pos.length ? `<div class="t-sec pos">Pontos Positivos</div>` + dest.pos.map(d=>`<div class="t-row"><span>${d.nome}</span><b class="cur">${d.nivel.toFixed(1)}/7</b></div>`).join('') : '';
        const negHtml = dest.neg.length ? `<div class="t-sec neg">Pontos Negativos</div>` + dest.neg.map(d=>`<div class="t-row"><span>${d.nome}</span><b class="ref">${d.nivel.toFixed(1)}/7</b></div>`).join('') : '';
        showTooltip(`<div class="t-title">${info?info.nome:dim}</div><div class="t-dim">nível de maturidade atual: ${lvl!=null?lvl:'sem dado'}</div>${posHtml}${negHtml}`, e, true);
        moveTooltip(e);
      });
      label.addEventListener('mouseleave', hideTooltip);
      dimLabelsGroup.appendChild(label);
    });
  }

  const tooltip = document.getElementById('tooltip');
  function showTooltip(html, evt, wide){ tooltip.innerHTML = html; tooltip.classList.add('show'); tooltip.classList.toggle('wide', !!wide); moveTooltip(evt); }
  function moveTooltip(evt){
    const pad=14; let x=evt.clientX+pad, y=evt.clientY+pad;
    if(x+270>window.innerWidth) x=evt.clientX-270-pad;
    if(y+90>window.innerHeight) y=evt.clientY-90-pad;
    tooltip.style.left=x+'px'; tooltip.style.top=y+'px';
  }
  function hideTooltip(){ tooltip.classList.remove('show'); }

  function attachBarEvents(seg, dim, topicSigla){
    seg.addEventListener('mousemove', (e)=>{
      const t = topicBySigla.get(topicSigla);
      const info = dimByCode.get(dim);
      const s = topicScore(state.focusCod, topicSigla);
      const curTxt = s && s.nc!=null ? `${s.nc.toFixed(1)}/7 (${s.yc})` : 'sem dado';
      const sameYear = s && s.nc!=null && s.no!=null && s.yc===s.yo;
      const oldTxt = sameYear ? 'sem histórico anterior' : (s && s.no!=null ? `${s.no.toFixed(1)}/7 (${s.yo})` : 'sem dado');
      showTooltip(`
        <div class="t-title">${t?t.nome:topicSigla}</div>
        <div class="t-dim">${info?info.nome:dim} · ${t?t.n:'?'} indicador(es)</div>
        <div class="t-row"><span>atual</span><b class="cur">${curTxt}</b></div>
        <div class="t-row"><span>antes</span><b class="ref">${oldTxt}</b></div>
      `, e);
      moveTooltip(e);
    });
    seg.addEventListener('mouseleave', hideTooltip);
  }

  function dimAvgRaw(cod, dim){
    const vals = topicsByDim[dim].map(ts=>{ const s=topicScore(cod,ts); return s&&s.nc!=null?s.nc:null; }).filter(v=>v!=null);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  }

  function renderRingsFor(cod){
    ringsGroup.innerHTML = '';
    dimRingGroup.innerHTML = '';

    dimsOrder.forEach(dim=>{
      const {mid, start, end} = wedgeAngles[dim];
      const halfW = (end-start)/2 * 0.86;
      // sort ascending so index 0 = lowest score → innermost; highest score → outermost band
      const ordered = [...topicsByDim[dim]].sort((a,b)=>{
        const sa = topicScore(cod,a), sb = topicScore(cod,b);
        const va = sa&&sa.nc!=null ? sa.nc : -1, vb = sb&&sb.nc!=null ? sb.nc : -1;
        return va-vb;
      });
      ordered.forEach((topicSigla,j)=>{
        const r0 = R_INNER + j*bandHeight + 1;
        const r1 = R_INNER + (j+1)*bandHeight - 1.4;
        const bgEl = svgEl('path',{d:annularSectorPath(0,0,r0,r1,mid-halfW,mid+halfW), class:'ring-seg-bg'});
        bgEl.style.pointerEvents='auto'; bgEl.style.cursor='pointer';
        attachBarEvents(bgEl, dim, topicSigla);
        ringsGroup.appendChild(bgEl);

        const s = topicScore(cod, topicSigla);
        // bullet-chart style: single bar for "atual", spanning the whole wedge width proportionally
        if(s && s.nc!=null){
          const a1 = (mid-halfW) + (2*halfW)*(s.nc/7);
          const seg = svgEl('path',{d:annularSectorPath(0,0,r0,r1, mid-halfW, a1), class:'ring-seg current'});
          attachBarEvents(seg, dim, topicSigla);
          ringsGroup.appendChild(seg);
        }
        // reference tick: only when a genuinely different historical year exists
        if(s && s.no!=null && s.yc!==s.yo){
          const at = (mid-halfW) + (2*halfW)*(s.no/7);
          const pA = polar(0,0,r0,at), pB = polar(0,0,r1,at);
          const tick = svgEl('line',{x1:pA.x.toFixed(2),y1:pA.y.toFixed(2),x2:pB.x.toFixed(2),y2:pB.y.toFixed(2), class:'ring-tick'});
          ringsGroup.appendChild(tick);
        }

        const lblR = (r0+r1)/2;
        const normMid = ((mid % 360)+360)%360;
        const bottomHalf = normMid > 0 && normMid < 180;
        let a0l = mid-halfW, a1l = mid+halfW;
        if(bottomHalf){ const tmp=a0l; a0l=a1l; a1l=tmp; }
        const p0 = polar(0,0,lblR,a0l), p1 = polar(0,0,lblR,a1l);
        const large = Math.abs(a1l-a0l) > 180 ? 1 : 0;
        const sweep = a1l > a0l ? 1 : 0;
        const pathId = 'lp-'+dim+'-'+topicSigla;
        const arcPathEl = svgEl('path', {id:pathId, d:`M ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} A ${lblR.toFixed(2)} ${lblR.toFixed(2)} 0 ${large} ${sweep} ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`, fill:'none', stroke:'none'});
        ringsGroup.appendChild(arcPathEl);
        const t = topicBySigla.get(topicSigla);
        const fullName = t ? t.nome : topicSigla;
        const has = !!(s && (s.nc!=null || s.no!=null));
        const label = svgEl('text', {class:'bar-label'+(has?'':' nodata')});
        label.style.pointerEvents = 'none';
        const textPath = svgEl('textPath', {startOffset:'3%'});
        textPath.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+pathId);
        textPath.setAttribute('href','#'+pathId);
        textPath.textContent = has ? (fullName.length > 26 ? fullName.slice(0,24)+'…' : fullName) : t.sigla;
        label.appendChild(textPath);
        ringsGroup.appendChild(label);
      });

      // dashed reference line: dimension average (decimal), cutting across all topic bars in this wedge
      const avg = dimAvgRaw(cod, dim);
      if(avg!=null){
        const aAvg = (mid-halfW) + (2*halfW)*(avg/7);
        const pA = polar(0,0,R_INNER,aAvg), pB = polar(0,0,R_OUTER,aAvg);
        ringsGroup.appendChild(svgEl('line',{x1:pA.x.toFixed(2),y1:pA.y.toFixed(2),x2:pB.x.toFixed(2),y2:pB.y.toFixed(2), class:'ring-avg-line'}));
        const lp = polar(0,0,R_OUTER+4,aAvg);
        const lbl = svgEl('text',{x:lp.x.toFixed(1),y:lp.y.toFixed(1),'text-anchor':'middle',class:'bar-label'});
        lbl.textContent = avg.toFixed(1);
        ringsGroup.appendChild(lbl);
      }

      // outer ring: 7-segment level gauge, 2-color tier scheme, filled up to the dimension's rounded level
      const dl = dimLevel(cod, dim, 'c');
      const ringR0 = R_OUTER + 10, ringR1 = R_DIMRING;
      const segGap = 1.5;
      const segH = (ringR1-ringR0-6*segGap)/7;
      const tierCol = dl!=null ? tierColor(dl) : null;
      for(let i=0;i<7;i++){
        const sr0 = ringR0 + i*(segH+segGap);
        const sr1 = sr0 + segH;
        const filled = dl!=null && (i+1)<=dl;
        const seg = svgEl('path',{d:annularSectorPath(0,0,sr0,sr1,mid-halfW,mid+halfW),
          class:'dim-ring-seg'+(filled?' filled':''), fill: filled ? tierCol : 'rgba(255,255,255,0.06)'});
        dimRingGroup.appendChild(seg);
      }
      if(dl!=null){
        const lp = polar(0,0,(ringR0+ringR1)/2, mid);
        const chip = svgEl('circle', {cx:lp.x.toFixed(1), cy:lp.y.toFixed(1), r:12, fill:'rgba(11,18,32,0.85)', stroke:tierCol, 'stroke-width':1.5});
        dimRingGroup.appendChild(chip);
        const lbl = svgEl('text', {x:lp.x.toFixed(1), y:lp.y.toFixed(1), 'text-anchor':'middle', 'dominant-baseline':'middle', class:'dim-ring-label'});
        lbl.textContent = dl;
        dimRingGroup.appendChild(lbl);
      }
    });

    // spider overlay driven by real dimension levels (1-7), spans over the bars
    spiderGroup.innerHTML = '';
    const spiderR = R_OUTER - 4;
    dimsOrder.forEach(dim=>{
      const {mid} = wedgeAngles[dim];
      const p = polar(0,0,spiderR,mid);
      spiderGroup.appendChild(svgEl('line',{x1:0,y1:0,x2:p.x.toFixed(1),y2:p.y.toFixed(1),class:'spider-axis'}));
    });
    const pts = dimsOrder.map(dim=>{
      const dl = dimLevel(cod, dim, 'c');
      const frac = dl!=null ? (dl-1)/6 : 0;
      return polar(0,0, R_INNER + (spiderR-R_INNER)*frac, wedgeAngles[dim].mid);
    });
    const d = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ')+' Z';
    spiderGroup.appendChild(svgEl('path',{d, class:'spider-poly'}));

    const m = muniByCod.get(String(cod));
    titleEl.textContent = m ? m.nome : '';
    subEl.textContent = m ? `${m.uf} · IBGE ${cod}` : '';
    const lc = muniLevel(cod,'c'), lo = muniLevel(cod,'o');
    if(lc!=null){
      let txt = `nível atual: ${lc}`;
      if(lo!=null && lo!==lc) txt += `  (antigo: ${lo})`;
      levelsEl.textContent = txt;
      levelsEl.setAttribute('fill', tierColor(lc));
    } else levelsEl.textContent = 'sem dado suficiente';
  }

  function setFocus(cod){
    if(state.focusCod!=null && markerByCod.has(String(state.focusCod))){
      markerByCod.get(String(state.focusCod)).setRadius(BASE_R);
    }
    state.focusCod = cod;
    if(cod==null) return;
    const marker = markerByCod.get(String(cod));
    if(marker) marker.setRadius(FOCUS_R);
    renderRingsFor(cod);
  }

  /* ---------- lens: whatever sits under the fixed center follows the map ---------- */
  const MAX_FOCUS_DIST = 220;
  function updateFocusFromCenter(){
    let best=null, bestD=MAX_FOCUS_DIST*MAX_FOCUS_DIST;
    for(const m of MUNI){
      if(m.lat==null) continue;
      const p = map.latLngToContainerPoint([m.lat,m.lon]);
      const dx=p.x-CX, dy=p.y-CY;
      const d=dx*dx+dy*dy;
      if(d<bestD){ bestD=d; best=m.cod; }
    }
    if(String(best)!==String(state.focusCod)) setFocus(best);
  }
  let rafPending=false;
  map.on('move', ()=>{
    if(rafPending) return;
    rafPending=true;
    requestAnimationFrame(()=>{ rafPending=false; updateFocusFromCenter(); });
  });

  function sizeOverlay(){
    const r = stageEl.getBoundingClientRect();
    overlay.setAttribute('width', r.width);
    overlay.setAttribute('height', r.height);
    overlay.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`);
    CX = r.width/2; CY = r.height/2;
    const minDim = Math.min(r.width, r.height);
    R_DIMRING = Math.max(160, minDim/2 - 90);
    R_OUTER = R_DIMRING - 26;
    R_INNER = Math.max(26, Math.min(R_OUTER*0.16, 54));
    bandHeight = (R_OUTER - R_INNER) / maxTopicsInDim;
    chartAnchor.setAttribute('transform', `translate(${CX},${CY})`);
    buildChartChrome();
    if(state.focusCod!=null) renderRingsFor(state.focusCod);
  }
  window.addEventListener('resize', ()=>{ sizeOverlay(); updateFocusFromCenter(); });

  /* ---------- reset ---------- */
  document.getElementById('reset-btn').addEventListener('click', ()=>{
    if(state.filterLevel!=null) exitLevelFilter();
    map.fitBounds(brazilBounds, {padding:[30,30]});
  });

  /* ---------- legend popup ---------- */
  const legendBtn = document.getElementById('legend-btn');
  const dimLegendEl = document.getElementById('dim-legend');
  dimLegendEl.innerHTML = dimsOrder.map(d=>{
    const info = dimByCode.get(d) || {nome:d};
    const topicsHtml = topicsByDim[d].map(ts=>{
      const t = topicBySigla.get(ts);
      return `<div class="topic-row"><span>${t?t.nome:ts}</span><span class="cnt">${t?t.n:'?'} ind.</span></div>`;
    }).join('');
    return `<div class="dim-block"><div class="dim-head"><span class="dim-name">${info.nome}</span></div>${topicsHtml}</div>`;
  }).join('');
  legendBtn.addEventListener('click', ()=> dimLegendEl.classList.toggle('show'));
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.dim-legend') && !e.target.closest('#legend-btn')) dimLegendEl.classList.remove('show');
  });

  /* ---------- search ---------- */
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  const muniSearchIndex = MUNI.map(m=>({cod:m.cod, nome:m.nome, uf:m.uf, lat:m.lat, lon:m.lon, norm: normalize(m.nome+' '+m.uf)}));
  searchInput.addEventListener('input', ()=>{
    const q = normalize(searchInput.value.trim());
    if(q.length<2){ searchResults.classList.remove('show'); searchResults.innerHTML=''; return; }
    const matches = muniSearchIndex.filter(m=>m.norm.includes(q)).slice(0,30);
    if(!matches.length){ searchResults.classList.remove('show'); searchResults.innerHTML=''; return; }
    searchResults.innerHTML = matches.map(m=>`<div data-cod="${m.cod}">${m.nome}<span class="uf">${m.uf}</span></div>`).join('');
    searchResults.classList.add('show');
  });
  searchResults.addEventListener('click', (e)=>{
    const row = e.target.closest('[data-cod]');
    if(!row) return;
    const m = muniByCod.get(row.dataset.cod);
    if(state.filterLevel!=null) exitLevelFilter();
    map.setView([m.lat,m.lon], Math.max(map.getZoom(),8), {animate:true});
    searchResults.classList.remove('show');
    searchInput.value = '';
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.ov-search')) searchResults.classList.remove('show');
  });

  /* ---------- scale bar: clickable level filter (1-7) ---------- */
  const scaleEl = document.getElementById('ov-scale');
  for(let lvl=1; lvl<=7; lvl++){
    const btn = document.createElement('div');
    btn.className = 'tick';
    btn.dataset.level = lvl;
    btn.style.background = tierColor(lvl);
    btn.textContent = lvl;
    btn.title = lvl<=2 ? 'Preparação' : 'Gestão e Governança';
    btn.addEventListener('click', ()=> toggleLevelFilter(lvl));
    scaleEl.appendChild(btn);
  }
  const scaleLabelsEl = document.createElement('div');
  scaleLabelsEl.className = 'tick-label-row';
  scaleLabelsEl.innerHTML = '<span>Preparação</span><span>Gestão e Governança</span>';
  document.querySelector('.stage').appendChild(scaleLabelsEl);
  function toggleLevelFilter(lvl){
    if(state.filterLevel===lvl){ exitLevelFilter(); return; }
    state.filterLevel = lvl;
    scaleEl.querySelectorAll('.tick').forEach(t=> t.classList.toggle('active', Number(t.dataset.level)===lvl));
    chartAnchor.style.display = 'none';
    document.getElementById('drag-hint').classList.add('hide');
    applyLevelFilter(lvl);
  }
  function applyLevelFilter(lvl){
    const matches = [];
    MUNI.forEach(m=>{
      const cm = markerByCod.get(String(m.cod));
      if(!cm) return;
      const l = muniLevel(m.cod,'c');
      if(l===lvl){ cm.setRadius(HOVER_R); cm.setStyle({fillOpacity:1}); matches.push(m); }
      else { cm.setRadius(1.2); cm.setStyle({fillOpacity:0.10}); if(cm.getTooltip()) cm.unbindTooltip(); }
    });
    state.filterMatches = matches;
    if(matches.length){
      const bounds = L.latLngBounds(matches.map(m=>[m.lat,m.lon]));
      map.fitBounds(bounds, {padding:[40,40], maxZoom:9});
    }
    setTimeout(updateFilterLabels, 350);
  }
  function updateFilterLabels(){
    if(state.filterLevel==null || !state.filterMatches) return;
    const zoomOk = map.getZoom() >= 6;
    const bounds = map.getBounds();
    state.filterMatches.forEach(m=>{
      const cm = markerByCod.get(String(m.cod));
      if(!cm) return;
      const visible = zoomOk && bounds.contains([m.lat,m.lon]);
      if(visible && !cm.getTooltip()){
        cm.bindTooltip(m.nome, { permanent:true, direction:'top', className:'muni-label', offset:[0,-4] });
      } else if(!visible && cm.getTooltip()){
        cm.unbindTooltip();
      }
    });
  }
  map.on('zoomend moveend', updateFilterLabels);

  function exitLevelFilter(){
    state.filterLevel = null;
    state.filterMatches = null;
    scaleEl.querySelectorAll('.tick').forEach(t=> t.classList.remove('active'));
    chartAnchor.style.display = '';
    document.getElementById('drag-hint').classList.remove('hide');
    MUNI.forEach(m=>{
      const cm = markerByCod.get(String(m.cod));
      if(!cm) return;
      cm.setRadius(BASE_R);
      cm.setStyle({fillOpacity:0.85});
      if(cm.getTooltip()) cm.unbindTooltip();
    });
    if(state.focusCod!=null) updateFocusFromCenter();
  }

  /* ---------- map label declutter: only show names once zoomed in, short text ---------- */
  function updateVisibleLabels(){
    if(state.filterLevel!=null) return; // filter mode has its own labeling
    const zoom = map.getZoom();
    const bounds = map.getBounds();
    const zoomOk = zoom >= 9; // raised threshold to reduce clutter
    if(!zoomOk){
      MUNI.forEach(m=>{ const cm=markerByCod.get(String(m.cod)); if(cm && cm.getTooltip()) cm.unbindTooltip(); });
      return;
    }
    const visibleMunis = MUNI.filter(m=> m.lat!=null && bounds.contains([m.lat,m.lon]));
    const capOk = visibleMunis.length <= 150;
    const visSet = new Set(visibleMunis.map(m=>m.cod));
    MUNI.forEach(m=>{
      const cm = markerByCod.get(String(m.cod));
      if(!cm) return;
      const shouldLabel = capOk && visSet.has(m.cod);
      if(shouldLabel && !cm.getTooltip()){
        cm.bindTooltip(m.nome, { permanent:true, direction:'top', className:'muni-label', offset:[0,-4] });
      } else if(!shouldLabel && cm.getTooltip()){
        cm.unbindTooltip();
      }
    });
  }
  map.on('zoomend moveend', updateVisibleLabels);

  /* ---------- init ---------- */
  sizeOverlay();
  recolorMarkers();
  map.whenReady(()=>{ updateFocusFromCenter(); });
});
</script>
</body>
</html>
