<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil Municipal · inteli.gente</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0B1220; --panel:#111A2E; --panel-2:#0E1626; --line: rgba(231,236,245,0.10);
    --text:#E7ECF5; --muted:#7C8AA5; --muted-2:#4C5A79;
    --current:#2FE0C4; --ref:#F5B14D;
    --brand-navy:#132257; --brand-teal:#2FE0C4;
    --lvl-low:#D1A85C; --lvl-high:#2FE0C4; --lvl-none:#5A6478;
    --serif: 'Source Serif Pro', Georgia, 'Iowan Old Style', serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;}
  a{color:inherit;}
  .app{height:100vh;display:flex;flex-direction:column;padding:8px 10px;}

  .ov-brand{top:14px;left:280px;display:flex;align-items:center;gap:8px;
    background:rgba(10,15,28,0.78);backdrop-filter:blur(6px);border:1px solid var(--line);
    padding:7px 12px;border-radius:9px;pointer-events:none;}
  .ov-brand .ig{font-family:var(--serif);font-weight:700;font-size:14px;color:#fff;}
  .ov-brand .ig b{color:var(--brand-teal);}
  .ov-brand .vis{font-family:var(--sans);font-weight:800;font-size:14px;color:#fff;}

  .stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a0f1c;
    flex:1 1 auto;min-height:0;}
  #leaflet-map{position:absolute;inset:0;background:#0a0f1c;}
  #leaflet-map .leaflet-tile-pane{filter:invert(1) hue-rotate(200deg) brightness(0.82) contrast(0.92) saturate(0.55);}
  #chart-overlay{position:absolute;inset:0;pointer-events:none;z-index:450;}
  .leaflet-container{background:#0a0f1c;font-family:var(--sans);}

  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0f1c;z-index:2000;font-family:var(--mono);font-size:13px;color:var(--muted);flex-direction:column;gap:10px;}
  .loading.hide{display:none;}
  .loading .bar{width:180px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}
  .loading .bar i{display:block;height:100%;width:30%;background:var(--current);animation:load 1.1s ease-in-out infinite;}
  @keyframes load{0%{margin-left:-30%;}100%{margin-left:100%;}}

  .ov{position:absolute;z-index:1000;}
  .ov-search{top:14px;left:14px;width:250px;}
  .ov-search input{width:100%;background:rgba(10,15,28,0.78);backdrop-filter:blur(6px);
    border:1px solid var(--line);color:var(--text);font-size:13.5px;padding:9px 12px;border-radius:9px;outline:none;}
  .ov-search input:focus{border-color:rgba(47,224,196,0.5);}
  .search-results{margin-top:4px;background:#0F1830;border:1px solid var(--line);border-radius:8px;
    max-height:210px;overflow-y:auto;display:none;}
  .search-results.show{display:block;}
  .search-results div{padding:7px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);}
  .search-results div:hover{background:rgba(47,224,196,0.10);}
  .search-results .uf{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:6px;}

  .ov-reset{top:14px;right:14px;}
  .ov-reset button{background:rgba(10,15,28,0.78);backdrop-filter:blur(6px);border:1px solid var(--line);
    color:var(--muted);font-family:var(--mono);font-size:11.5px;padding:8px 13px;border-radius:9px;cursor:pointer;}
  .ov-reset button:hover{color:var(--text);border-color:rgba(47,224,196,0.4);}

  .ov-drag-hint{bottom:14px;left:50%;transform:translateX(-50%);text-align:center;color:var(--muted);
    font-family:var(--mono);font-size:11px;background:rgba(10,15,28,0.78);backdrop-filter:blur(6px);
    padding:7px 14px;border-radius:9px;pointer-events:none;border:1px solid var(--line);}

  .ov-legend-btn{bottom:14px;left:14px;}
  .ov-legend-btn button{background:rgba(10,15,28,0.78);backdrop-filter:blur(6px);border:1px solid var(--line);
    color:var(--muted);font-family:var(--mono);font-size:11px;padding:7px 12px;border-radius:9px;cursor:pointer;}
  .ov-legend-btn button:hover{color:var(--text);}
  .dim-legend{position:absolute;bottom:52px;left:14px;z-index:1001;background:#0F1830;border:1px solid var(--line);
    border-radius:10px;padding:14px 16px;width:360px;max-height:520px;overflow-y:auto;display:none;}
  .dim-legend.show{display:block;}
  .dim-legend .dim-block{margin-bottom:14px;}
  .dim-legend .dim-block:last-child{margin-bottom:0;}
  .dim-legend .dim-head{display:flex;gap:8px;align-items:baseline;margin-bottom:4px;}
  .dim-legend .dim-code{font-family:var(--mono);font-weight:700;color:var(--current);font-size:12px;}
  .dim-legend .dim-name{font-weight:600;font-size:13.5px;}
  .dim-legend .dim-desc{color:var(--muted);font-size:11px;line-height:1.4;margin-bottom:6px;}
  .dim-legend .unofficial{color:var(--muted-2);font-size:9.5px;margin-bottom:6px;}
  .dim-legend .topic-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:3px 0 3px 4px;
    border-left:2px solid var(--line);padding-left:8px;color:var(--text);}
  .dim-legend .topic-row .cnt{color:var(--muted-2);font-family:var(--mono);font-size:10px;white-space:nowrap;}

  .bottom-bar{flex:none;margin-top:8px;padding:8px 16px 10px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    display:flex;align-items:center;gap:16px;}
  #trend-svg{width:38%;height:60px;display:block;flex:none;}
  .trend-axis-label{font-family:var(--mono);font-size:9px;fill:var(--muted-2);}
  .th-circle{stroke:var(--bg);stroke-width:2;fill:var(--current);}
  .th-circle.ref{fill:var(--ref);}
  .th-label{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--current);}
  .th-label.ref{fill:var(--ref);}
  .year-click:hover{fill:var(--current);}
  .trend-handle{touch-action:none;}

  .scale-ticks{flex:1;display:flex;border-radius:8px;overflow:hidden;min-width:160px;}
  .scale-ticks .tick{flex:1;text-align:center;font-family:var(--mono);font-size:12px;padding:8px 2px;
    border-right:1px solid rgba(11,18,32,0.35);color:var(--bg);font-weight:700;cursor:pointer;
    transition:transform 100ms ease, filter 100ms ease;}
  .scale-ticks .tick:last-child{border-right:none;}
  .scale-ticks .tick:hover{filter:brightness(1.15);}
  .scale-ticks .tick.active{transform:scaleY(1.18);box-shadow:0 0 0 2px #fff inset;}
  .scale-ticks .tick i{font-style:normal;display:block;font-size:7.5px;font-weight:400;opacity:0.75;}
  .scale-caption{font-family:var(--mono);font-size:9.5px;color:var(--muted-2);white-space:nowrap;}

  .dim-label{font-family:var(--mono);font-weight:600;font-size:12px;fill:var(--text);cursor:help;}
  .ring-seg-bg{fill:rgba(255,255,255,0.045);}
  .bar-label{font-family:var(--mono);font-size:8.5px;fill:#fff;dominant-baseline:middle;
    paint-order:stroke;stroke:rgba(11,18,32,0.85);stroke-width:2.2px;stroke-linejoin:round;}
  .bar-label.nodata{fill:rgba(255,255,255,0.55);font-size:7.5px;}
  .ring-seg{cursor:pointer;pointer-events:auto;}
  .ring-seg.current{fill:var(--current);}
  .ring-seg.ref{fill:var(--ref);}
  .ring-seg.percentil.current{fill:#B085F5;}
  .ring-seg.percentil.ref{fill:#7A5FA8;}
  .center-hole{fill:var(--panel-2);fill-opacity:0.28;stroke:var(--line);}
  .center-text-name{fill:var(--text);font-family:var(--serif);font-size:15px;font-weight:600;}
  .center-text-sub{fill:var(--muted);font-family:var(--mono);font-size:10px;}
  .center-idx{fill:var(--current);font-family:var(--serif);font-size:25px;font-weight:600;}
  .center-idx-cap{fill:var(--muted);font-family:var(--mono);font-size:9px;letter-spacing:0.03em;}
  .center-delta{font-family:var(--mono);font-size:10px;font-weight:700;}
  .center-delta.up{fill:var(--current);}
  .center-delta.down{fill:var(--ref);}
  .spider-poly{fill:rgba(47,224,196,0.10);stroke:var(--current);stroke-width:1.6;stroke-dasharray:4 3;pointer-events:none;}
  .spider-axis{stroke:rgba(255,255,255,0.10);stroke-width:1;}
  .grid-ring{fill:none;stroke:rgba(255,255,255,0.05);stroke-width:1;}
  .reticle-dot{fill:var(--current);stroke:#fff;stroke-width:1.5;}

  .tooltip{position:fixed;pointer-events:none;background:#0F1830;border:1px solid var(--line);border-radius:8px;
    padding:9px 11px;font-size:12px;line-height:1.5;max-width:270px;z-index:2000;opacity:0;
    transition:opacity 100ms ease;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
  .tooltip.show{opacity:1;}
  .tooltip .t-title{font-weight:600;margin-bottom:3px;color:var(--text);}
  .tooltip .t-dim{color:var(--muted);font-family:var(--mono);font-size:10.5px;margin-bottom:5px;}
  .tooltip .t-row{display:flex;justify-content:space-between;gap:14px;}
  .tooltip .t-row b.cur{color:var(--current);}
  .tooltip .t-row b.ref{color:var(--ref);}

  .muni-label{font-family:var(--mono) !important;font-size:10px !important;background:rgba(10,15,28,0.85) !important;
    border:1px solid var(--line) !important;color:var(--text) !important;padding:1px 5px !important;border-radius:4px !important;
    box-shadow:none !important;}
  .muni-label::before{display:none !important;}
</style>
</head>
<body>
<div class="app">

  <div class="stage">
    <div id="leaflet-map"></div>
    <svg id="chart-overlay"></svg>
    <div class="loading" id="loading"><div>carregando dados…</div><div class="bar"><i></i></div></div>

    <div class="ov ov-search">
      <input id="search-input" type="text" placeholder="Buscar município ou UF…" autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="ov ov-brand"><span class="ig">inteli<b>.gente</b></span><span class="vis">vis</span></div>
    <div class="ov ov-reset"><button id="reset-btn">↺ ver Brasil todo</button></div>
    <div class="ov ov-drag-hint" id="drag-hint">arraste o mapa · clique num ponto · ou busque acima</div>
    <div class="ov ov-legend-btn"><button id="legend-btn">ⓘ dimensões e tópicos</button></div>
    <div class="dim-legend" id="dim-legend"></div>
  </div>

  <div class="bottom-bar">
    <svg id="trend-svg" viewBox="0 0 900 60" preserveAspectRatio="none"></svg>
    <div class="scale-ticks" id="scale-ticks"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =========================================================
   CSV LOADING
   ========================================================= */
function parseCSV(text){
  // RFC4180-ish parser (handles quoted fields with commas)
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ',') { row.push(field); field=''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const header = rows[0];
  return rows.slice(1).filter(r=>r.length===header.length && r.some(v=>v!=='')).map(r=>{
    const obj = {};
    header.forEach((h,i)=> obj[h]=r[i]);
    return obj;
  });
}
function fastSplitCSV(text){
  // no-quotes fast path for scores.csv
  const lines = text.split('\n');
  const header = lines[0].replace('\r','').split(',');
  const out = [];
  for(let i=1;i<lines.length;i++){
    const line = lines[i].replace('\r','');
    if(!line) continue;
    const parts = line.split(',');
    if(parts.length!==header.length) continue;
    const obj = {};
    for(let j=0;j<header.length;j++) obj[header[j]]=parts[j];
    out.push(obj);
  }
  return out;
}

async function loadData(){
  const [muniTxt, topicsTxt, dimsTxt, scoresTxt] = await Promise.all([
    fetch('municipios.csv').then(r=>r.text()),
    fetch('topics.csv').then(r=>r.text()),
    fetch('dims.csv').then(r=>r.text()),
    fetch('scores.csv').then(r=>r.text()),
  ]);
  const muniRows = parseCSV(muniTxt);
  const MUNI = muniRows.map(r=>({
    cod:r.cod_ibge, nome:r.nome, uf:r.uf, regiao:r.regiao,
    lat: r.lat?parseFloat(r.lat):null, lon: r.lon?parseFloat(r.lon):null
  }));
  const topicRows = parseCSV(topicsTxt);
  const TOPICS = topicRows.map(r=>({sigla:r.topico_sigla, nome:r.topico_nome, dim:r.dimensao_sigla, n:parseInt(r.n_indicadores), metrica:r.metrica}));
  const dimRows = parseCSV(dimsTxt);
  const DIMS = dimRows.map(r=>({sigla:r.dimensao_sigla, nome:r.dimensao_nome, desc:r.descricao, oficial:r.oficial==='sim', metrica:r.metrica}));
  const scoreRows = fastSplitCSV(scoresTxt);
  const SCORES = {}; // year -> cod -> topico -> valor
  const yearSet = new Set();
  scoreRows.forEach(r=>{
    const y = r.ano;
    yearSet.add(y);
    if(!SCORES[y]) SCORES[y] = {};
    if(!SCORES[y][r.cod_ibge]) SCORES[y][r.cod_ibge] = {};
    SCORES[y][r.cod_ibge][r.topico_sigla] = parseFloat(r.valor);
  });
  const YEARS = Array.from(yearSet).map(Number).sort((a,b)=>a-b);
  return { MUNI, TOPICS, DIMS, SCORES, YEARS };
}

/* =========================================================
   MAIN (after data loads)
   ========================================================= */
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){ const el=document.createElementNS(NS,tag); for(const k in attrs) el.setAttribute(k,attrs[k]); return el; }
function normalize(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
const NIVEL_MAX = 7;
const LVL_SPLIT = 3.5; // 1–3 vs 4–7
const LVL_LOW = '#D1A85C', LVL_HIGH = '#2FE0C4', LVL_NONE = '#5A6478';
function levelColor(comp){ return comp==null ? LVL_NONE : (comp < LVL_SPLIT ? LVL_LOW : LVL_HIGH); }
function levelBucket(comp){ return comp==null ? null : Math.min(7, Math.max(1, Math.round(comp))); }

loadData().then(({MUNI, TOPICS, DIMS, SCORES, YEARS})=>{
  document.getElementById('loading').classList.add('hide');

  const state = { focusCod:null, yearIdx: YEARS.length-1, refYearIdx: Math.max(0,YEARS.length-2), filterLevel:null };
  const muniByCod = new Map(MUNI.map(m=>[m.cod,m]));
  const dimByCode = new Map(DIMS.map(d=>[d.sigla,d]));
  const topicBySigla = new Map(TOPICS.map(t=>[t.sigla,t]));
  const dimsOrder = DIMS.map(d=>d.sigla).sort();
  const topicsByDim = {};
  dimsOrder.forEach(d=>topicsByDim[d]=[]);
  TOPICS.forEach(t=>{ if(topicsByDim[t.dim]) topicsByDim[t.dim].push(t.sigla); });

  function scoresForMuni(year, cod){ return (SCORES[year] && SCORES[year][cod]) || {}; }
  function compositeScore(year, cod){
    // only the 4 official (nível) dimensions feed the composite index — the other 4 use a different scale (percentil)
    const s = scoresForMuni(year,cod);
    const vals = TOPICS.filter(t=>t.metrica==='nivel' && s[t.sigla]!=null).map(t=>s[t.sigla]);
    if(!vals.length) return null;
    return vals.reduce((a,b)=>a+b,0)/vals.length;
  }

  /* ---------- Leaflet map ---------- */
  const map = L.map('leaflet-map', { zoomControl:true, minZoom:4, maxZoom:14, worldCopyJump:false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', subdomains:'abc', maxZoom:19
  }).addTo(map);

  let latMin=90, latMax=-90, lonMin=180, lonMax=-180;
  MUNI.forEach(m=>{
    if(m.lat==null||m.lon==null) return;
    if(m.lat<latMin) latMin=m.lat; if(m.lat>latMax) latMax=m.lat;
    if(m.lon<lonMin) lonMin=m.lon; if(m.lon>lonMax) lonMax=m.lon;
  });
  const brazilBounds = L.latLngBounds([latMin,lonMin],[latMax,lonMax]);
  map.fitBounds(brazilBounds, {padding:[30,30]});

  const canvasRenderer = L.canvas({ padding: 0.5 });
  const markerByCod = new Map();
  const BASE_R = 5, HOVER_R = 8, FOCUS_R = 9.5;
  MUNI.forEach(m=>{
    if(m.lat==null||m.lon==null) return;
    const cm = L.circleMarker([m.lat,m.lon], {
      renderer: canvasRenderer, radius:BASE_R, weight:0,
      fillColor: LVL_NONE, fillOpacity:0.7
    }).addTo(map);
    cm.on('mouseover', (e)=>{
      cm.setRadius(HOVER_R);
      const comp = compositeScore(YEARS[state.yearIdx], m.cod);
      showTooltip(`<div class="t-title">${m.nome}</div><div class="t-dim">${m.uf} · nível ${comp!=null?comp.toFixed(1):'sem dado'}</div>`, e.originalEvent);
    });
    cm.on('mousemove', (e)=> moveTooltip(e.originalEvent));
    cm.on('mouseout', ()=>{
      if(String(m.cod)!==String(state.focusCod)) cm.setRadius(BASE_R);
      hideTooltip();
    });
    cm.on('click', (e)=>{
      L.DomEvent.stopPropagation(e);
      if(state.filterLevel!=null) exitLevelFilter();
      map.setView([m.lat,m.lon], Math.max(map.getZoom(),8), {animate:true});
    });
    markerByCod.set(String(m.cod), cm);
  });
  map.on('click', (e)=> map.setView(e.latlng, Math.max(map.getZoom(),7), {animate:true}));

  function recolorMarkers(){
    const year = YEARS[state.yearIdx];
    MUNI.forEach(m=>{
      const cm = markerByCod.get(String(m.cod));
      if(!cm) return;
      cm.setStyle({fillColor: levelColor(compositeScore(year, m.cod))});
    });
  }

  /* ---------- fixed chart overlay ---------- */
  const stageEl = document.querySelector('.stage');
  const overlay = document.getElementById('chart-overlay');
  let CX=0, CY=0, R_INNER=46, R_OUTER=172, bandHeight=10;

  const chartAnchor = svgEl('g', {id:'chart-anchor'});
  overlay.appendChild(chartAnchor);
  const haloGrad = svgEl('radialGradient', {id:'haloGrad'});
  haloGrad.appendChild(svgEl('stop', {offset:'0%','stop-color':'#0E1626','stop-opacity':'0.92'}));
  haloGrad.appendChild(svgEl('stop', {offset:'68%','stop-color':'#0E1626','stop-opacity':'0.82'}));
  haloGrad.appendChild(svgEl('stop', {offset:'100%','stop-color':'#0E1626','stop-opacity':'0'}));
  const defs = svgEl('defs', {}); defs.appendChild(haloGrad); overlay.appendChild(defs);

  let ringsGroup, dimLabelsGroup, idxEl, idxCapEl, deltaEl, spiderGroup, titleEl, subEl;

  const maxTopicsInDim = Math.max(...dimsOrder.map(d=>topicsByDim[d].length));
  const totalTopics = TOPICS.length;
  const WEDGE_GAP_DEG = 3;
  const totalGap = WEDGE_GAP_DEG * dimsOrder.length;
  const usableDeg = 360 - totalGap;
  let wedgeAngles = {};
  { let cursor=-90;
    dimsOrder.forEach(d=>{
      const count = topicsByDim[d].length;
      const span = usableDeg * (count/totalTopics);
      wedgeAngles[d] = {start:cursor, end:cursor+span, mid:cursor+span/2};
      cursor += span + WEDGE_GAP_DEG;
    });
  }
  function polar(cx,cy,r,deg){ const rad=deg*Math.PI/180; return {x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad)}; }
  function annularSectorPath(cx,cy,r0,r1,a0,a1){
    const large = Math.abs(a1-a0) > 180 ? 1 : 0;
    const sweep = a1 > a0 ? 1 : 0;
    const p0=polar(cx,cy,r0,a0), p1=polar(cx,cy,r1,a0), p2=polar(cx,cy,r1,a1), p3=polar(cx,cy,r0,a1);
    return `M ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}
            A ${r1.toFixed(2)} ${r1.toFixed(2)} 0 ${large} ${sweep} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}
            L ${p3.x.toFixed(2)} ${p3.y.toFixed(2)}
            A ${r0.toFixed(2)} ${r0.toFixed(2)} 0 ${large} ${1-sweep} ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} Z`;
  }

  const WHEEL_LABELS = {
    'CI':['Capacidades','Institucionais'], 'CIT':['Governança','de TIC'], 'CS':['Contexto','Socioeconômico'],
    'CTA':['Vocação','Territorial'], 'CTD':['Infraestrutura','C,T&I'], 'EC':['Econômica'],
    'MA':['Meio','Ambiente'], 'SC':['Sociocultural']
  };

  function buildChartChrome(){
    chartAnchor.innerHTML = '';
    const halo = svgEl('circle', {cx:0, cy:0, r:R_OUTER+56, fill:'url(#haloGrad)'});
    chartAnchor.appendChild(halo);
    // radial gridlines (reading scale for bar length, expert-vis staple)
    const gridGroup = svgEl('g', {id:'grid-group'});
    [0.33,0.66,1].forEach(f=>{
      gridGroup.appendChild(svgEl('circle', {cx:0,cy:0,r:R_INNER+(R_OUTER-R_INNER)*f, class:'grid-ring'}));
    });
    chartAnchor.appendChild(gridGroup);
    ringsGroup = svgEl('g', {id:'rings-group'});
    chartAnchor.appendChild(ringsGroup);
    spiderGroup = svgEl('g', {id:'spider-group'});
    chartAnchor.appendChild(spiderGroup);
    dimLabelsGroup = svgEl('g', {id:'dim-labels-group'});
    chartAnchor.appendChild(dimLabelsGroup);
    const hole = svgEl('circle', {cx:0, cy:0, r:R_INNER-5, class:'center-hole'});
    chartAnchor.appendChild(hole);
    const reticleDot = svgEl('circle', {cx:0, cy:0, r:2.5, class:'reticle-dot'});
    chartAnchor.appendChild(reticleDot);
    idxEl = svgEl('text', {x:0, y:-8, 'text-anchor':'middle', class:'center-idx'});
    chartAnchor.appendChild(idxEl);
    idxCapEl = svgEl('text', {x:0, y:9, 'text-anchor':'middle', class:'center-idx-cap'});
    idxCapEl.textContent = 'nível médio · escala 1–7';
    chartAnchor.appendChild(idxCapEl);
    deltaEl = svgEl('text', {x:0, y:21, 'text-anchor':'middle', class:'center-delta'});
    chartAnchor.appendChild(deltaEl);
    titleEl = svgEl('text', {x:0, y:-R_OUTER-52, 'text-anchor':'middle', class:'center-text-name'});
    titleEl.setAttribute('font-size','19');
    chartAnchor.appendChild(titleEl);
    subEl = svgEl('text', {x:0, y:-R_OUTER-32, 'text-anchor':'middle', class:'center-text-sub'});
    chartAnchor.appendChild(subEl);

    dimsOrder.forEach(dim=>{
      const {mid} = wedgeAngles[dim];
      const labelR = R_INNER + maxTopicsInDim*bandHeight + 26;
      const lp = polar(0,0,labelR,mid);
      const lines = WHEEL_LABELS[dim] || [dim];
      const label = svgEl('text', {x:lp.x.toFixed(1), y:lp.y.toFixed(1), class:'dim-label', 'text-anchor':'middle'});
      const startDy = -((lines.length-1)/2) * 13;
      lines.forEach((line,li)=>{
        const tspan = svgEl('tspan', {x:lp.x.toFixed(1), dy: li===0 ? startDy : 13});
        tspan.textContent = line;
        label.appendChild(tspan);
      });
      label.addEventListener('mousemove', (e)=>{
        const info = dimByCode.get(dim);
        showTooltip(`<div class="t-title">${info?info.nome:dim} <span style="color:var(--muted-2);font-family:var(--mono);font-size:10px;">(${dim})</span></div><div class="t-dim">${info?info.desc:''}${info&&!info.oficial?' <i>(agrupamento inferido)</i>':''}</div>`, e);
        moveTooltip(e);
      });
      label.addEventListener('mouseleave', hideTooltip);
      dimLabelsGroup.appendChild(label);
    });
  }

  function sizeOverlay(){
    const r = stageEl.getBoundingClientRect();
    overlay.setAttribute('width', r.width);
    overlay.setAttribute('height', r.height);
    overlay.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`);
    CX = r.width/2; CY = r.height/2;
    const minDim = Math.min(r.width, r.height);
    R_OUTER = Math.max(140, minDim/2 - 90);
    R_INNER = Math.max(30, Math.min(R_OUTER*0.20, 66));
    bandHeight = (R_OUTER - R_INNER) / maxTopicsInDim;
    chartAnchor.setAttribute('transform', `translate(${CX},${CY})`);
    buildChartChrome();
    if(state.focusCod!=null) renderRingsFor(state.focusCod);
  }

  const tooltip = document.getElementById('tooltip');
  function showTooltip(html, evt){ tooltip.innerHTML = html; tooltip.classList.add('show'); moveTooltip(evt); }
  function moveTooltip(evt){
    const pad=14; let x=evt.clientX+pad, y=evt.clientY+pad;
    if(x+270>window.innerWidth) x=evt.clientX-270-pad;
    if(y+90>window.innerHeight) y=evt.clientY-90-pad;
    tooltip.style.left=x+'px'; tooltip.style.top=y+'px';
  }
  function hideTooltip(){ tooltip.classList.remove('show'); }

  function valueRange(metrica){ return metrica==='nivel' ? [1,NIVEL_MAX] : [0,100]; }
  function formatVal(v, metrica){ return metrica==='nivel' ? v.toFixed(1)+'/7' : v.toFixed(0)+'%ile'; }
  function hasAnyData(cod, topicSigla){ return YEARS.some(y=> scoresForMuni(y,cod)[topicSigla]!=null); }

  function miniLineChart(topicSigla, metrica){
    const W=210, H=64, PL=26, PR=8, PT=6, PB=14;
    const [vMin,vMax] = valueRange(metrica);
    const pts = YEARS.map((y,i)=>{
      const v = scoresForMuni(y, state.focusCod)[topicSigla];
      if(v==null) return null;
      const x = PL + (W-PL-PR) * (i/(YEARS.length-1));
      const yy = PT + (H-PT-PB) * (1 - (v-vMin)/(vMax-vMin));
      return {x,y:yy,v};
    });
    let d=''; let drawing=false;
    pts.forEach(p=>{ if(!p){drawing=false;return;} d+=(drawing?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)+' '; drawing=true; });
    const col = metrica==='percentil'?'#B085F5':'#2FE0C4';
    const dots = pts.map(p=> p? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.4" fill="${col}"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y-6).toFixed(1)}" font-size="7.5" fill="#fff" text-anchor="middle" font-family="monospace">${formatVal(p.v,metrica)}</text>` : '').join('');
    const yrLabels = YEARS.map((y,i)=>`<text x="${(PL+(W-PL-PR)*(i/(YEARS.length-1))).toFixed(1)}" y="${H-2}" font-size="7" fill="#7C8AA5" text-anchor="middle" font-family="monospace">${String(y).slice(2)}</text>`).join('');
    const axisTop = formatVal(vMax,metrica), axisBot = formatVal(vMin,metrica);
    return `<svg width="${W}" height="${H}" style="display:block;margin-top:4px;overflow:visible;">
      <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="#4C5A79" stroke-width="1"/>
      <text x="${PL-4}" y="${PT+6}" font-size="7" fill="#7C8AA5" text-anchor="end" font-family="monospace">${axisTop}</text>
      <text x="${PL-4}" y="${H-PB}" font-size="7" fill="#7C8AA5" text-anchor="end" font-family="monospace">${axisBot}</text>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="1.4" stroke-opacity="0.85"/>
      ${dots}${yrLabels}
    </svg>`;
  }

  function attachBarEvents(seg, dim, topicSigla, metrica){
    seg.addEventListener('mousemove', (e)=>{
      const t = topicBySigla.get(topicSigla);
      const info = dimByCode.get(dim);
      const has = hasAnyData(state.focusCod, topicSigla);
      showTooltip(`
        <div class="t-title">${t?t.nome:topicSigla}</div>
        <div class="t-dim">${info?info.nome:dim} · ${t?t.n:'?'} indicador(es)${metrica==='percentil'?' · <i>percentil, não nível oficial</i>':''}</div>
        ${has ? miniLineChart(topicSigla, metrica) : '<div class="t-dim">sem dado em nenhum dos 6 anos para este município</div>'}
      `, e);
      moveTooltip(e);
    });
    seg.addEventListener('mouseleave', hideTooltip);
  }

  function renderRingsFor(cod){
    ringsGroup.innerHTML = '';
    const curYear = YEARS[state.yearIdx], refYear = YEARS[state.refYearIdx];
    const SLIM_FRAC = 0.38;

    dimsOrder.forEach(dim=>{
      const {mid, start, end} = wedgeAngles[dim];
      const halfW = (end-start)/2 * 0.86;
      const topicsRaw = topicsByDim[dim];
      const withData = topicsRaw.filter(ts=>hasAnyData(cod, ts));
      const noData = topicsRaw.filter(ts=>!hasAnyData(cod, ts));
      const ordered = withData.concat(noData);
      const nSlim = noData.length, nNormal = withData.length;
      const dimSpan = topicsRaw.length * bandHeight;
      const normalH = dimSpan / ((nNormal + nSlim*SLIM_FRAC) || 1);
      const slimH = normalH * SLIM_FRAC;

      let offset = 0;
      ordered.forEach(topicSigla=>{
        const has = withData.includes(topicSigla);
        const h = has ? normalH : slimH;
        const r0 = R_INNER + offset + 1;
        const r1 = R_INNER + offset + h - 1.4;
        offset += h;

        const topicMeta = topicBySigla.get(topicSigla);
        const metrica = topicMeta ? topicMeta.metrica : 'nivel';
        const [vMin,vMax] = valueRange(metrica);
        const isPct = metrica==='percentil';

        const bgEl = svgEl('path',{d:annularSectorPath(0,0,r0,r1,mid-halfW,mid+halfW), class:'ring-seg-bg'});
        bgEl.style.pointerEvents='auto'; bgEl.style.cursor='pointer';
        attachBarEvents(bgEl, dim, topicSigla, metrica);
        ringsGroup.appendChild(bgEl);

        const curV = scoresForMuni(curYear, cod)[topicSigla];
        const refV = scoresForMuni(refYear, cod)[topicSigla];
        if(refV!=null){
          const a0 = mid - halfW*((refV-vMin)/(vMax-vMin));
          const seg = svgEl('path',{d:annularSectorPath(0,0,r0,r1, a0, mid), class:'ring-seg ref'+(isPct?' percentil':'')});
          attachBarEvents(seg, dim, topicSigla, metrica);
          ringsGroup.appendChild(seg);
        }
        if(curV!=null){
          const a1 = mid + halfW*((curV-vMin)/(vMax-vMin));
          const seg = svgEl('path',{d:annularSectorPath(0,0,r0,r1, mid, a1), class:'ring-seg current'+(isPct?' percentil':'')});
          attachBarEvents(seg, dim, topicSigla, metrica);
          ringsGroup.appendChild(seg);
        }

        // topic name label, curved along the arc — short keyword if no data at all
        const lblR = (r0+r1)/2;
        const normMid = ((mid % 360)+360)%360;
        const bottomHalf = normMid > 0 && normMid < 180;
        let a0l = mid-halfW, a1l = mid+halfW;
        if(bottomHalf){ const tmp=a0l; a0l=a1l; a1l=tmp; }
        const p0 = polar(0,0,lblR,a0l), p1 = polar(0,0,lblR,a1l);
        const large = Math.abs(a1l-a0l) > 180 ? 1 : 0;
        const sweep = a1l > a0l ? 1 : 0;
        const pathId = 'lp-'+dim+'-'+topicSigla;
        const arcPathEl = svgEl('path', {id:pathId, d:`M ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} A ${lblR.toFixed(2)} ${lblR.toFixed(2)} 0 ${large} ${sweep} ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`, fill:'none', stroke:'none'});
        ringsGroup.appendChild(arcPathEl);
        const t = topicBySigla.get(topicSigla);
        const fullName = t ? t.nome : topicSigla;
        const label = svgEl('text', {class:'bar-label'+(has?'':' nodata')});
        label.style.pointerEvents = 'none';
        const textPath = svgEl('textPath', {startOffset:'3%'});
        textPath.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+pathId);
        textPath.setAttribute('href','#'+pathId);
        textPath.textContent = has ? (fullName.length > 26 ? fullName.slice(0,24)+'…' : fullName) : topicSigla;
        label.appendChild(textPath);
        ringsGroup.appendChild(label);
      });
    });

    // spider overlay: one axis per dimension, aligned to its wedge, spans full radar (over the bars)
    spiderGroup.innerHTML = '';
    const spiderR = R_OUTER - 4;
    dimsOrder.forEach(dim=>{
      const {mid} = wedgeAngles[dim];
      const p = polar(0,0,spiderR,mid);
      spiderGroup.appendChild(svgEl('line',{x1:0,y1:0,x2:p.x.toFixed(1),y2:p.y.toFixed(1),class:'spider-axis'}));
    });
    const pts = dimsOrder.map(dim=>{
      const topics = topicsByDim[dim];
      let sum=0,n=0;
      topics.forEach(ts=>{
        const v = scoresForMuni(curYear, cod)[ts];
        if(v==null) return;
        const meta = topicBySigla.get(ts);
        const [vMin,vMax] = valueRange(meta.metrica);
        sum += (v-vMin)/(vMax-vMin); n++;
      });
      const frac = n ? sum/n : 0;
      return polar(0,0, R_INNER + (spiderR-R_INNER)*frac, wedgeAngles[dim].mid);
    });
    const d = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ')+' Z';
    spiderGroup.appendChild(svgEl('path',{d, class:'spider-poly'}));

    const m = muniByCod.get(String(cod));
    titleEl.textContent = m ? m.nome : '';
    subEl.textContent = m ? `${m.uf} · IBGE ${cod} · ${curYear} vs ${refYear}` : '';
    const curComp = compositeScore(curYear, cod);
    const refComp = compositeScore(refYear, cod);
    idxEl.textContent = curComp!=null ? curComp.toFixed(1) : '–';
    if(curComp!=null && refComp!=null){
      const delta = curComp-refComp;
      deltaEl.textContent = (delta>=0?'▲ +':'▼ ')+Math.abs(delta).toFixed(1);
      deltaEl.setAttribute('class','center-delta '+(delta>=0?'up':'down'));
    } else deltaEl.textContent = '';

    renderTrend(cod);
  }

  function setFocus(cod){
    if(state.focusCod!=null && markerByCod.has(String(state.focusCod))){
      markerByCod.get(String(state.focusCod)).setRadius(BASE_R);
    }
    state.focusCod = cod;
    if(cod==null) return;
    const marker = markerByCod.get(String(cod));
    if(marker) marker.setRadius(FOCUS_R);
    renderRingsFor(cod);
  }

  /* ---------- lens: whatever sits under the fixed center follows the map ---------- */
  const MAX_FOCUS_DIST = 220; // px
  function updateFocusFromCenter(){
    let best=null, bestD=MAX_FOCUS_DIST*MAX_FOCUS_DIST;
    for(const m of MUNI){
      if(m.lat==null) continue;
      const p = map.latLngToContainerPoint([m.lat,m.lon]);
      const dx=p.x-CX, dy=p.y-CY;
      const d=dx*dx+dy*dy;
      if(d<bestD){ bestD=d; best=m.cod; }
    }
    if(String(best)!==String(state.focusCod)) setFocus(best);
  }
  let rafPending=false;
  map.on('move', ()=>{
    if(rafPending) return;
    rafPending=true;
    requestAnimationFrame(()=>{ rafPending=false; updateFocusFromCenter(); });
  });

  window.addEventListener('resize', ()=>{ sizeOverlay(); updateFocusFromCenter(); });

  /* ---------- reset ---------- */
  document.getElementById('reset-btn').addEventListener('click', ()=>{
    map.fitBounds(brazilBounds, {padding:[30,30]});
  });

  /* ---------- legend ---------- */
  const legendBtn = document.getElementById('legend-btn');
  const dimLegendEl = document.getElementById('dim-legend');
  dimLegendEl.innerHTML = dimsOrder.map(d=>{
    const info = dimByCode.get(d) || {nome:d, desc:'', oficial:false};
    const topicsHtml = topicsByDim[d].map(ts=>{
      const t = topicBySigla.get(ts);
      return `<div class="topic-row"><span>${t?t.nome:ts}</span><span class="cnt">${ts} · ${t?t.n:'?'} ind.</span></div>`;
    }).join('');
    return `<div class="dim-block">
      <div class="dim-head"><span class="dim-code">${d}</span><span class="dim-name">${info.nome}</span></div>
      <div class="dim-desc">${info.desc}</div>
      ${!info.oficial?'<div class="unofficial">agrupamento inferido dos dados, não documentado publicamente pela plataforma</div>':''}
      ${topicsHtml}
    </div>`;
  }).join('');
  legendBtn.addEventListener('click', ()=> dimLegendEl.classList.toggle('show'));
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.dim-legend') && !e.target.closest('#legend-btn')) dimLegendEl.classList.remove('show');
  });

  /* ---------- search ---------- */
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  const muniSearchIndex = MUNI.map(m=>({cod:m.cod, nome:m.nome, uf:m.uf, lat:m.lat, lon:m.lon, norm: normalize(m.nome+' '+m.uf)}));
  searchInput.addEventListener('input', ()=>{
    const q = normalize(searchInput.value.trim());
    if(q.length<2){ searchResults.classList.remove('show'); searchResults.innerHTML=''; return; }
    const matches = muniSearchIndex.filter(m=>m.norm.includes(q)).slice(0,30);
    if(!matches.length){ searchResults.classList.remove('show'); searchResults.innerHTML=''; return; }
    searchResults.innerHTML = matches.map(m=>`<div data-cod="${m.cod}">${m.nome}<span class="uf">${m.uf}</span></div>`).join('');
    searchResults.classList.add('show');
  });
  searchResults.addEventListener('click', (e)=>{
    const row = e.target.closest('[data-cod]');
    if(!row) return;
    const m = muniByCod.get(row.dataset.cod);
    map.setView([m.lat,m.lon], Math.max(map.getZoom(),8), {animate:true});
    searchResults.classList.remove('show');
    searchInput.value = '';
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.ov-search')) searchResults.classList.remove('show');
  });

  /* ---------- trend line chart (two handles: atual + referência) ---------- */
  const trendSvg = document.getElementById('trend-svg');
  const TW = 900, TH = 60, TPAD_L = 34, TPAD_R = 14, TPAD_T = 8, TPAD_B = 14;
  const plotW = TW - TPAD_L - TPAD_R, plotH = TH - TPAD_T - TPAD_B;
  function xForYearIdx(i){ return TPAD_L + (YEARS.length===1 ? plotW/2 : plotW * i/(YEARS.length-1)); }
  function yForVal(v){ return TPAD_T + plotH * (1 - (v-1)/(NIVEL_MAX-1)); }

  const trendStatic = svgEl('g', {});
  trendSvg.appendChild(trendStatic);
  [1,7].forEach(v=>{
    const y = yForVal(v);
    const lbl = svgEl('text', {x:TPAD_L-6, y:y+3, 'text-anchor':'end', class:'trend-axis-label'});
    lbl.textContent = v; trendStatic.appendChild(lbl);
  });
  YEARS.forEach((y,i)=>{
    const x = xForYearIdx(i);
    const lbl = svgEl('text', {x, y:TH-2, 'text-anchor':'middle', class:'trend-axis-label year-click'});
    lbl.textContent = y;
    lbl.style.pointerEvents = 'auto';
    lbl.style.cursor = 'pointer';
    lbl.addEventListener('click', ()=>{
      state.yearIdx = i;
      if(state.focusCod!=null) renderRingsFor(state.focusCod);
      recolorMarkers();
      if(state.filterLevel!=null) applyLevelFilter(state.filterLevel);
    });
    trendStatic.appendChild(lbl);
  });

  const trendPath = svgEl('path', {fill:'none', stroke:'var(--muted)', 'stroke-width':1.6, 'stroke-opacity':0.55});
  trendSvg.appendChild(trendPath);
  const trendDotsGroup = svgEl('g', {});
  trendSvg.appendChild(trendDotsGroup);

  function makeHandle(cls){
    const g = svgEl('g', {class:'trend-handle '+cls, style:'cursor:ew-resize;'});
    g.appendChild(svgEl('circle', {r:6, class:'th-circle '+cls}));
    const lbl = svgEl('text', {y:-10, 'text-anchor':'middle', class:'th-label '+cls});
    g.appendChild(lbl);
    trendSvg.appendChild(g);
    return {g, lbl};
  }
  const curHandle = makeHandle('cur');
  const refHandle = makeHandle('ref');

  function nearestYearIdxFromX(clientX){
    const rect = trendSvg.getBoundingClientRect();
    const relX = (clientX - rect.left) / rect.width * TW;
    let best=0, bestD=Infinity;
    YEARS.forEach((y,i)=>{ const d=Math.abs(xForYearIdx(i)-relX); if(d<bestD){bestD=d;best=i;} });
    return best;
  }
  function attachDrag(handleObj, which){
    handleObj.g.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      try{ handleObj.g.setPointerCapture(e.pointerId); }catch(err){}
      const onMove = (ev)=>{
        const idx = nearestYearIdxFromX(ev.clientX);
        if(which==='cur') state.yearIdx = idx; else state.refYearIdx = idx;
        if(state.focusCod!=null) renderRingsFor(state.focusCod);
        recolorMarkers();
        if(state.filterLevel!=null) applyLevelFilter(state.filterLevel);
      };
      const onUp = (ev)=>{
        try{ handleObj.g.releasePointerCapture(e.pointerId); }catch(err){}
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }
  attachDrag(curHandle, 'cur');
  attachDrag(refHandle, 'ref');

  function renderTrend(cod){
    const pts = YEARS.map((y,i)=>{
      const v = compositeScore(y, cod);
      return v==null ? null : {x:xForYearIdx(i), y:yForVal(v), v};
    });
    const valid = pts.filter(p=>p);
    trendPath.setAttribute('d', valid.length>1 ? valid.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ') : '');
    trendDotsGroup.innerHTML = '';
    pts.forEach(p=>{
      if(!p) return;
      trendDotsGroup.appendChild(svgEl('circle', {cx:p.x, cy:p.y, r:2.2, fill:'var(--muted)', 'fill-opacity':0.6}));
    });
    const curP = pts[state.yearIdx];
    if(curP){
      curHandle.g.setAttribute('transform', `translate(${curP.x},${curP.y})`);
      curHandle.lbl.textContent = YEARS[state.yearIdx];
    }
    const refP = pts[state.refYearIdx];
    if(refP){
      refHandle.g.setAttribute('transform', `translate(${refP.x},${refP.y})`);
      refHandle.lbl.textContent = YEARS[state.refYearIdx];
    }
  }

  /* ---------- scale ticks (clickable) + level filter mode ---------- */
  state.filterLevel = null;
  const scaleTicksEl = document.getElementById('scale-ticks');
  for(let lvl=1; lvl<=7; lvl++){
    const btn = document.createElement('div');
    btn.className = 'tick';
    btn.dataset.level = lvl;
    btn.style.background = lvl <= 3 ? LVL_LOW : LVL_HIGH;
    btn.innerHTML = lvl + (lvl===1?'<i>básico</i>':lvl===7?'<i>avançado</i>':'');
    btn.addEventListener('click', ()=> toggleLevelFilter(lvl));
    scaleTicksEl.appendChild(btn);
  }

  function toggleLevelFilter(lvl){
    if(state.filterLevel===lvl){ exitLevelFilter(); return; }
    state.filterLevel = lvl;
    scaleTicksEl.querySelectorAll('.tick').forEach(t=> t.classList.toggle('active', Number(t.dataset.level)===lvl));
    chartAnchor.style.display = 'none';
    document.getElementById('drag-hint').classList.add('hide');
    applyLevelFilter(lvl);
  }
  function exitLevelFilter(){
    state.filterLevel = null;
    state.filterMatches = null;
    scaleTicksEl.querySelectorAll('.tick').forEach(t=> t.classList.remove('active'));
    chartAnchor.style.display = '';
    document.getElementById('drag-hint').classList.remove('hide');
    MUNI.forEach(m=>{
      const cm = markerByCod.get(String(m.cod));
      if(!cm) return;
      cm.setRadius(BASE_R);
      cm.setStyle({fillOpacity:0.7});
      if(cm.getTooltip()) cm.unbindTooltip();
    });
    if(state.focusCod!=null) updateFocusFromCenter();
  }
  function applyLevelFilter(lvl){
    const year = YEARS[state.yearIdx];
    const matches = [];
    MUNI.forEach(m=>{
      const cm = markerByCod.get(String(m.cod));
      if(!cm) return;
      const comp = compositeScore(year, m.cod);
      const bucket = levelBucket(comp);
      if(bucket===lvl){
        cm.setRadius(HOVER_R);
        cm.setStyle({fillOpacity:1});
        matches.push(m);
      } else {
        cm.setRadius(1.2);
        cm.setStyle({fillOpacity:0.12});
        if(cm.getTooltip()) cm.unbindTooltip();
      }
    });
    state.filterMatches = matches;
    if(matches.length){
      const bounds = L.latLngBounds(matches.map(m=>[m.lat,m.lon]));
      map.fitBounds(bounds, {padding:[40,40], maxZoom:9});
    }
    // labels bind/unbind dynamically based on zoom + current viewport (see updateFilterLabels)
    setTimeout(updateFilterLabels, 350); // after fitBounds animation settles
  }
  function updateFilterLabels(){
    const year = YEARS[state.yearIdx];
    const zoom = map.getZoom();
    const bounds = map.getBounds();
    if(state.filterLevel!=null && state.filterMatches){
      const zoomOk = zoom >= 6;
      state.filterMatches.forEach(m=>{
        const cm = markerByCod.get(String(m.cod));
        if(!cm) return;
        const visible = zoomOk && bounds.contains([m.lat,m.lon]);
        if(visible && !cm.getTooltip()){
          const comp = compositeScore(year, m.cod);
          cm.bindTooltip(`${m.nome} · nível ${comp!=null?comp.toFixed(1):'—'}`, {
            permanent:true, direction:'top', className:'muni-label', offset:[0,-4]
          });
        } else if(!visible && cm.getTooltip()){
          cm.unbindTooltip();
        }
      });
      return;
    }
    // normal mode: label visible dots once zoomed in enough, capped to avoid clutter
    const zoomOk = zoom >= 8;
    if(!zoomOk){
      MUNI.forEach(m=>{ const cm=markerByCod.get(String(m.cod)); if(cm && cm.getTooltip()) cm.unbindTooltip(); });
      return;
    }
    const visibleMunis = MUNI.filter(m=> m.lat!=null && bounds.contains([m.lat,m.lon]));
    const capOk = visibleMunis.length <= 300;
    MUNI.forEach(m=>{
      const cm = markerByCod.get(String(m.cod));
      if(!cm) return;
      const shouldLabel = capOk && visibleMunis.includes(m);
      if(shouldLabel && !cm.getTooltip()){
        const comp = compositeScore(year, m.cod);
        cm.bindTooltip(`${m.nome} · ${comp!=null?comp.toFixed(1):'—'}`, {
          permanent:true, direction:'top', className:'muni-label', offset:[0,-4]
        });
      } else if(!shouldLabel && cm.getTooltip()){
        cm.unbindTooltip();
      }
    });
  }
  map.on('zoomend moveend', updateFilterLabels);

  /* ---------- init ---------- */
  sizeOverlay();
  recolorMarkers();
  map.whenReady(()=>{ updateFocusFromCenter(); });
});
</script>
